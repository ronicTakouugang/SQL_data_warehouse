<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciel — trafic simulé</title>
<style>
  :root{
    --ink:#04070F;
    --magenta:#FF3EA5;
    --ambre:#FFC145;
    --bleu:#5CD0FF;
    --texte:#A8B6D2;
    --texte-fort:#EDF2FB;
    --trait:rgba(122,144,186,.18);
    --mono: ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ink);color:var(--texte);
    font-family:var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;cursor:grab}
  canvas.tire{cursor:grabbing}

  .titre{position:fixed;top:24px;left:26px;pointer-events:none;z-index:3}
  .titre h1{margin:0;font-size:12px;font-weight:600;letter-spacing:.48em;
    color:var(--texte-fort);text-transform:uppercase;transition:opacity .3s}
  .titre .rule{width:30px;height:1px;background:var(--magenta);margin:13px 0 11px;
    box-shadow:0 0 10px var(--magenta)}
  .titre p{margin:0;font-size:10px;letter-spacing:.13em;color:#657190;max-width:30ch;line-height:1.85}

  .horloge{position:fixed;top:24px;right:26px;text-align:right;pointer-events:none;z-index:3}
  .horloge b{display:block;font-size:23px;font-weight:300;letter-spacing:.05em;color:var(--texte-fort);
    text-shadow:0 0 24px rgba(92,208,255,.35)}
  .horloge span{font-size:9px;letter-spacing:.26em;color:#657190}
  .horloge .phase{color:var(--ambre)}

  .strips{position:fixed;right:22px;top:104px;bottom:118px;width:252px;z-index:3;
    display:flex;flex-direction:column;gap:5px;overflow:hidden;
    mask-image:linear-gradient(180deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
  .strip{position:relative;border:1px solid var(--trait);background:rgba(8,13,27,.6);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    padding:8px 10px 10px;flex:0 0 auto;overflow:hidden;cursor:pointer;
    transition:border-color .2s,background .2s,transform .2s}
  .strip:hover{border-color:rgba(255,193,69,.5);background:rgba(14,22,44,.8);transform:translateX(-3px)}
  .strip .l1{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;color:var(--texte-fort);letter-spacing:.09em}
  .strip .l1 em{font-style:normal;color:var(--ambre)}
  .strip .l2{display:flex;justify-content:space-between;margin-top:5px;
    font-size:9px;letter-spacing:.11em;color:#6F80A0}
  .strip .barre{position:absolute;left:0;bottom:0;height:2px;background:var(--magenta);
    box-shadow:0 0 9px rgba(255,62,165,.85)}
  .strip.suivi{border-color:var(--ambre);background:rgba(26,21,13,.82)}
  .strip.suivi .barre{background:var(--ambre);box-shadow:0 0 9px rgba(255,193,69,.85)}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:3}
  .lab{position:absolute;transform:translate(11px,-50%);white-space:nowrap;
    font-size:9px;letter-spacing:.2em;color:#8296B8;transition:opacity .3s}
  .lab b{color:var(--bleu);font-weight:500}
  .lab i{font-style:normal;color:#56637E;margin-left:7px;letter-spacing:.09em}

  .panneau{position:fixed;left:26px;bottom:24px;display:flex;gap:20px;align-items:flex-end;
    flex-wrap:wrap;z-index:3;max-width:calc(100% - 300px)}
  .champ{display:flex;flex-direction:column;gap:8px}
  .champ label{font-size:9px;letter-spacing:.21em;color:#657190;text-transform:uppercase}
  .champ label b{color:var(--texte-fort);font-weight:400}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:1px;background:#26314C;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;
    background:var(--ambre);cursor:pointer;border-radius:50%;box-shadow:0 0 10px rgba(255,193,69,.7)}
  input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--ambre);border:0;
    cursor:pointer;border-radius:50%}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{font-family:inherit;font-size:9px;letter-spacing:.17em;text-transform:uppercase;
    background:transparent;color:#6F80A0;border:1px solid var(--trait);padding:7px 11px;
    cursor:pointer;transition:.18s}
  button:hover{color:var(--texte-fort);border-color:rgba(122,144,186,.5)}
  button[aria-pressed=true]{color:#0B0F1C;background:var(--ambre);border-color:var(--ambre)}
  button:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
  #bMonde{border-color:rgba(92,208,255,.45);color:var(--bleu)}
  #bMonde:hover{background:rgba(92,208,255,.12)}
  #bLarge{display:none}
  #bLarge.on{display:inline-block;color:#0B0F1C;background:var(--bleu);border-color:var(--bleu)}
  .masque{opacity:.25;pointer-events:none}

  .aide{position:fixed;right:26px;bottom:24px;font-size:9px;letter-spacing:.15em;
    color:#48546C;text-align:right;line-height:2;pointer-events:none;z-index:3}

  .fondu{position:fixed;inset:0;background:var(--ink);opacity:0;pointer-events:none;
    z-index:8;transition:opacity .35s}
  .fondu.on{opacity:1}

  .demarrage{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:9;transition:opacity .9s}
  .demarrage span{font-size:10px;letter-spacing:.34em;color:#657190;text-transform:uppercase}
  .demarrage .jauge{width:150px;height:1px;background:#1C2540;overflow:hidden}
  .demarrage .jauge i{display:block;height:100%;width:0;background:var(--ambre);
    box-shadow:0 0 10px var(--ambre);animation:remplir 1.2s ease-out forwards}
  @keyframes remplir{to{width:100%}}
  .demarrage.parti{opacity:0;pointer-events:none}

  @media (max-width:900px){
    .strips{display:none} .titre p{display:none} .aide{display:none}
    .panneau{left:16px;right:16px;bottom:16px;gap:14px;max-width:none}
  }
  @media (prefers-reduced-motion:reduce){ .demarrage .jauge i{animation-duration:.2s} }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header class="titre">
  <h1 id="hTitre">Ciel de France</h1>
  <div class="rule"></div>
  <p id="pTitre">Trafic intérieur simulé sous une journée qui passe en six minutes.</p>
</header>

<div class="horloge">
  <b id="utc">00:00:00</b>
  <span>heure simulée · <span class="phase" id="phase">nuit</span></span>
</div>

<div class="strips" id="strips" aria-label="Bandes de progression"></div>
<div id="labels"></div>

<div class="panneau">
  <div class="champ">
    <label for="vols">Trafic · <b id="nVols">20</b> · en l'air <b id="nAir">0</b></label>
    <input id="vols" type="range" min="3" max="60" value="20">
  </div>
  <div class="champ">
    <label for="vitesse">Vitesse · <b id="xVitesse">1.0</b>×</label>
    <input id="vitesse" type="range" min="0.2" max="4" step="0.1" value="1">
  </div>
  <div class="champ">
    <label for="heure">Heure · <b id="hHeure">18</b> h</label>
    <input id="heure" type="range" min="0" max="1439" value="1092">
  </div>
  <div class="champ" id="champNuages">
    <label for="nuages">Nuages · <b id="cNuages">55</b> %</label>
    <input id="nuages" type="range" min="0" max="100" value="55">
  </div>
  <div class="champ">
    <label>Vue</label>
    <div class="btns">
      <button id="bMonde">Globe</button>
      <button id="bRoutes" aria-pressed="true">Routes</button>
      <button id="bTerrains" aria-pressed="true">Terrains</button>
      <button id="bRotation" aria-pressed="true">Rotation</button>
      <button id="bLarge">Vue générale</button>
    </div>
  </div>
</div>

<div class="aide" id="aide">Glisser — pivoter<br>Molette — altitude de vue<br>Cliquer un avion — le suivre</div>

<div class="fondu" id="fondu"></div>
<div class="demarrage" id="demarrage">
  <span id="txtCharge">Calcul du relief</span>
  <div class="jauge"><i></i></div>
</div>

const S = 12.4, LON0 = 2.4, LAT0 = 46.6, K = Math.cos(LAT0*RAD);
const px = lon => (lon-LON0)*K*S;
const py = lat => (lat-LAT0)*S;
const SOL = 2.6, RELIEF = 0.5, Y_NUAGES = 40;
const R_GLOBE = 100;

function dansPoly(lon, lat, poly){
  if (poly.bbox && (lon < poly.bbox[0] || lon > poly.bbox[1] || lat < poly.bbox[2] || lat > poly.bbox[3]))
    return false;
  let d = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > lat) !== (yj > lat) && lon < (xj-xi)*(lat-yi)/(yj-yi) + xi) d = !d;
  }
  return d;
}
const surTerre = (lon,lat) => dansPoly(lon,lat,HEXAGONE) || dansPoly(lon,lat,CORSE);
function surTerreMonde(lon, lat){
  if (lat < -68 + 4*Math.sin(lon*RAD*3)) return true;          // Antarctique
  for (let i = 0; i < TROUS.length; i++) if (dansPoly(lon,lat,TROUS[i])) return false;
  for (let i = 0; i < TERRES.length; i++) if (dansPoly(lon,lat,TERRES[i])) return true;
  return false;
}
function gauss(lon,lat,cx,cy,sx,sy){
  const dx = lon-cx, dy = lat-cy;
  return Math.exp(-(dx*dx/(2*sx*sx) + dy*dy/(2*sy*sy)));
}
function altitude(lon, lat){
  let h = 0;
  function g(cx,cy,sx,sy,a,rot){
    let dx = lon-cx, dy = lat-cy;
    if (rot){ const c = Math.cos(rot), s = Math.sin(rot);
      const nx = dx*c-dy*s, ny = dx*s+dy*c; dx = nx; dy = ny; }
    h += a*Math.exp(-(dx*dx/(2*sx*sx)+dy*dy/(2*sy*sy)));
  }
  g(6.55,45.30,0.80,0.85,10.6,0.5); g(6.25,45.90,0.62,0.60,8.8,0.4);
  g(7.00,44.45,0.50,0.50,6.2,0);    g(6.30,46.70,0.55,0.48,4.6,0.6);
  for (let i = 0; i < 7; i++){
    const t = i/6;
    g(-1.35+t*3.75, 42.95-t*0.42, 0.42, 0.26, 8.4-Math.abs(t-0.5)*4.4, 0);
  }
  g(2.65,45.25,1.05,0.90,4.5,0); g(3.55,44.75,0.70,0.55,3.7,0);
  g(7.05,48.25,0.32,0.72,3.5,0); g(4.15,47.25,0.55,0.45,2.0,0);
  g(4.75,49.75,0.55,0.30,1.6,0); g(9.15,42.25,0.34,0.55,6.9,0.2);
  h += 0.62*Math.sin(lon*3.1)*Math.cos(lat*2.7)
     + 0.34*Math.sin(lon*7.3+1.2)*Math.sin(lat*6.1)
     + 0.18*Math.cos(lon*13.7)*Math.sin(lat*11.3);
  return Math.max(0, h + 0.95);
}
const solY = (lon,lat) => SOL + altitude(lon,lat)*RELIEF;
function foret(lon,lat){
  let f = 1.05*gauss(lon,lat,-0.90,44.25,1.00,0.80) + 0.85*gauss(lon,lat,7.00,48.25,0.35,0.85)
        + 0.70*gauss(lon,lat,2.65,45.25,1.00,0.95) + 0.60*gauss(lon,lat,4.90,48.70,0.65,0.50)
        + 0.45*gauss(lon,lat,6.30,46.70,0.50,0.45) + 0.40*gauss(lon,lat,9.15,42.20,0.35,0.55);
  f += 0.12*Math.sin(lon*9.1)*Math.cos(lat*7.7);
  return Math.max(0, Math.min(1,f));
}
function garrigue(lon,lat){
  return Math.max(0, Math.min(1,
    1.1*gauss(lon,lat,5.20,43.55,1.60,0.60) + 0.8*gauss(lon,lat,8.90,41.90,0.60,0.60)));
}
// relief mondial, très schématique
function altitudeMonde(lon,lat){
  let h = 0.25;
  h += 3.2*gauss(lon,lat,86,31,11,4.5);        // Himalaya / Tibet
  h += 1.1*gauss(lon,lat,100,42,12,6);         // Altaï / Gobi
  h += 1.5*gauss(lon,lat,-110,44,7,10);        // Rocheuses
  h += 0.9*gauss(lon,lat,10,46,5,2);           // Alpes
  h += 1.2*gauss(lon,lat,40,10,6,7);           // hauts plateaux éthiopiens
  h += 1.6*gauss(lon,lat,-42,73,13,8);         // calotte du Groenland
  h += 0.8*gauss(lon,lat,60,35,10,5);          // Iran / Hindou Kouch
  for (let i = 0; i < 9; i++){                 // Andes
    const t = i/8;
    h += 2.2*gauss(lon,lat, -71+t*7, 5-t*50, 2.4, 4.5);
  }
  if (lat < -66) h += 2.2;
  return h;
}
function desert(lon,lat){
  return Math.min(1,
      1.15*gauss(lon,lat,15,21,17,6)   + 0.9*gauss(lon,lat,46,23,9,6)
    + 0.8*gauss(lon,lat,101,41,11,5)   + 0.9*gauss(lon,lat,133,-25,10,7)
    + 0.7*gauss(lon,lat,-69,-23,3,7)   + 0.7*gauss(lon,lat,21,-23,6,5)
    + 0.7*gauss(lon,lat,-112,36,7,5)   + 0.7*gauss(lon,lat,65,28,7,5));
}

  "float hh21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }",
  "float bruit(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);",
  "  float a = hh21(i), b = hh21(i+vec2(1.0,0.0)), c = hh21(i+vec2(0.0,1.0)), d = hh21(i+vec2(1.0,1.0));",
  "  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }",
  "float fbm(vec2 p){ float s = 0.0, a = 0.5;",
  "  for(int i = 0; i < 5; i++){ s += a*bruit(p); p = p*2.03 + vec2(1.7,-2.3); a *= 0.5; }",
  "  return s; }"
].join("\n");
const GLSL_DENSITE = [
  "float densiteNuage(vec2 p){",
  "  vec2 vent = vec2(uT*0.85, uT*0.35);",
  "  float d = fbm(p*0.0072 + vent*0.010);",
  "  d += 0.34 * fbm(p*0.0225 - vent*0.016);",
  "  return smoothstep(uSeuil, uSeuil + 0.30, d*0.78);",
  "}"
].join("\n");

function injecter(mat, vagues){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = uT; sh.uniforms.uSeuil = uSeuil;
    sh.uniforms.uOff = uOff; sh.uniforms.uOmbreF = uOmbreF;
    sh.vertexShader = "varying vec3 vPW;\n" + sh.vertexShader.replace(
      "#include <begin_vertex>",
      "#include <begin_vertex>\n  vPW = (modelMatrix * vec4(position,1.0)).xyz;");
    let f = "uniform float uT; uniform float uSeuil; uniform vec2 uOff; uniform float uOmbreF;\n"
          + "varying vec3 vPW;\n" + GLSL_BRUIT + "\n" + GLSL_DENSITE + "\n" + sh.fragmentShader;
    if (vagues){
      f = f.replace("#include <normal_fragment_begin>",
        "#include <normal_fragment_begin>\n  {\n"
        + "    vec2 q = vPW.xz;\n"
        + "    float n1 = sin(q.x*0.085 + uT*0.55) + sin(q.y*0.104 - uT*0.47);\n"
        + "    float n2 = sin((q.x+q.y)*0.052 + uT*0.83) + sin((q.x-q.y)*0.037 - uT*0.61);\n"
        + "    normal = normalize(normal + vec3(n1*0.030 + n2*0.018, 0.0, n2*0.030 - n1*0.018));\n"
        + "  }");
    }
    f = f.replace("#include <output_fragment>",
      "#include <output_fragment>\n  {\n"
      + "    float dn = densiteNuage(vPW.xz + uOff);\n"
      + "    gl_FragColor.rgb *= mix(1.0, mix(1.0, 0.42, dn), uOmbreF);\n  }");
    sh.fragmentShader = f;
  };
}

              uEch:{value:echelle}, uEp:{value:epaisseur}, uTeinte:{value:new THREE.Color(teinte)}},

const PAS = 0.042;

      cHaut = new THREE.Color(0x55688F), cNeige = new THREE.Color(0xD6E2F5),
      cForet = new THREE.Color(0x1B3A3C), cGarrigue = new THREE.Color(0x3A3348);
const _t1 = new THREE.Color();

function construireRelief(){
  const pos = new Float32Array(NX*NY*3), col = new Float32Array(NX*NY*3);
  const dedans = new Uint8Array(NX*NY), c = new THREE.Color();
  for (let j = 0; j < NY; j++){
    const lat = LAT_MIN + j*PAS;
    for (let i = 0; i < NX; i++){
      const lon = LON_MIN + i*PAS, k = j*NX+i, h = altitude(lon,lat);
      pos[k*3] = px(lon); pos[k*3+1] = SOL + h*RELIEF; pos[k*3+2] = -py(lat);
      dedans[k] = surTerre(lon,lat) ? 1 : 0;
      const t = Math.min(1, h/9.8);
      if (t < 0.35)      c.copy(cBas).lerp(cMoyen, t/0.35);
      else if (t < 0.70) c.copy(cMoyen).lerp(cHaut, (t-0.35)/0.35);
      else               c.copy(cHaut).lerp(cNeige, Math.pow((t-0.70)/0.30,1.35));
      const basAlt = 1 - Math.min(1, t/0.55);
      c.lerp(_t1.copy(cForet), foret(lon,lat)*0.40*basAlt);
      c.lerp(_t1.copy(cGarrigue), garrigue(lon,lat)*0.30*basAlt);
      col[k*3] = c.r; col[k*3+1] = c.g; col[k*3+2] = c.b;
    }
  }
  const idx = [];
  for (let j = 0; j < NY-1; j++) for (let i = 0; i < NX-1; i++){
    const a = j*NX+i, b = a+1, d = a+NX, e = d+1;
    if (dedans[a] && dedans[b] && dedans[d] && dedans[e]) idx.push(a,d,b, b,d,e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.9, metalness:0.06});
  injecter(mat,false);
  const m = new THREE.Mesh(g,mat);
  m.castShadow = true; m.receiveShadow = true; gFrance.add(m);
}

function surSphere(lon, lat, r){
  const a = lon*RAD, b = lat*RAD, cb = Math.cos(b);
  return new THREE.Vector3(r*cb*Math.cos(a), r*Math.sin(b), -r*cb*Math.sin(a));
}

function construireGlobe(){
  if (globeConstruit) return;
  globeConstruit = true;

  // océan
  const ocean = new THREE.Mesh(new THREE.SphereGeometry(R_GLOBE,96,64),
    new THREE.MeshStandardMaterial({color:0x0A1B3A, roughness:0.24, metalness:0.62}));
  terre.add(ocean);

  // terres émergées
  const P = 1.0;
  const NXG = 361, NYG = 181;
  const pos = new Float32Array(NXG*NYG*3), col = new Float32Array(NXG*NYG*3);
  const dedans = new Uint8Array(NXG*NYG), c = new THREE.Color();
  const cPlaine = new THREE.Color(0x24384A), cVert = new THREE.Color(0x1E4438),
        cSec = new THREE.Color(0x4A4038), cRoche = new THREE.Color(0x5A6076),
        cGlace = new THREE.Color(0xE2ECF8), cBoreal = new THREE.Color(0x22384A);
  for (let j = 0; j < NYG; j++){
    const lat = -90 + j*P;
    for (let i = 0; i < NXG; i++){
      const lon = -180 + i*P, k = j*NXG+i;
      const terreIci = surTerreMonde(lon,lat);
      dedans[k] = terreIci ? 1 : 0;
      const h = terreIci ? altitudeMonde(lon,lat) : 0;
      const v = surSphere(lon,lat, R_GLOBE + 0.35 + h*0.55);
      pos[k*3] = v.x; pos[k*3+1] = v.y; pos[k*3+2] = v.z;
      const al = Math.abs(lat);
      c.copy(cPlaine);
      c.lerp(cVert, Math.max(0, 1 - Math.abs(lat)/26) * 0.75);
      c.lerp(cBoreal, Math.max(0, Math.min(1,(al-48)/14)) * 0.6);
      c.lerp(cSec, desert(lon,lat)*0.8);
      c.lerp(cRoche, Math.min(1, h/3.2)*0.55);
      const glace = Math.max(Math.min(1,(al-66)/6), lat < -64 ? 1 : 0);
      c.lerp(cGlace, glace*0.92);
      col[k*3] = c.r; col[k*3+1] = c.g; col[k*3+2] = c.b;
    }
  }
  const idx = [];
  for (let j = 0; j < NYG-1; j++) for (let i = 0; i < NXG-1; i++){
    const a = j*NXG+i, b = a+1, d = a+NXG, e = d+1;
    if (dedans[a] && dedans[b] && dedans[d] && dedans[e]) idx.push(a,b,d, b,e,d);
  }
  const gl = new THREE.BufferGeometry();
  gl.setAttribute("position", new THREE.BufferAttribute(pos,3));
  gl.setAttribute("color", new THREE.BufferAttribute(col,3));
  gl.setIndex(idx); gl.computeVertexNormals();
  terre.add(new THREE.Mesh(gl, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.92, metalness:0.04})));

  // traits de côte
  const matCote = new THREE.LineBasicMaterial({color:0xBFE6FF, transparent:true, opacity:0.42,
    blending:THREE.AdditiveBlending, depthWrite:false});
  TERRES.forEach(p => {
    const pts = [];
    for (let i = 0; i < p.length; i++){
      const a = p[i], b = p[(i+1)%p.length];
      for (let s = 0; s < 4; s++){
        const f = s/4;
        pts.push(surSphere(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, R_GLOBE+1.1));
      }
    }
    terre.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), matCote));
  });

  // lumières nocturnes
  const n = MONDE_VILLES.length;
  const lp = new Float32Array(n*3), ln = new Float32Array(n*3);

    const p = surSphere(v[0], v[1], R_GLOBE+1.0);
    lp[i*3] = p.x; lp[i*3+1] = p.y; lp[i*3+2] = p.z;
    const u = p.clone().normalize();
    ln[i*3] = u.x; ln[i*3+1] = u.y; ln[i*3+2] = u.z;
  });
  const gv = new THREE.BufferGeometry();
  gv.setAttribute("position", new THREE.BufferAttribute(lp,3));
  gv.setAttribute("aNorm", new THREE.BufferAttribute(ln,3));
  matLumieres = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms:{tHalo:{value:HALO}, uSunL:uSunLocal, uTaille:{value:24.0}},
    vertexShader:["attribute vec3 aNorm; uniform vec3 uSunL; uniform float uTaille;",
      "varying float vNuit;",
      "void main(){",
      "  vNuit = smoothstep(0.14, -0.22, dot(normalize(aNorm), normalize(uSunL)));",
      "  vec4 mv = modelViewMatrix*vec4(position,1.0);",
      "  gl_PointSize = uTaille*(180.0/max(1.0,-mv.z));",
      "  gl_Position = projectionMatrix*mv; }"].join("\n"),
    fragmentShader:["uniform sampler2D tHalo; varying float vNuit;",
      "void main(){ if (vNuit <= 0.01) discard;",
      "  vec4 h = texture2D(tHalo, gl_PointCoord);",
      "  gl_FragColor = vec4(vec3(1.0,0.80,0.52)*h.a*vNuit*0.95, h.a*vNuit); }"].join("\n")
  });
  terre.add(new THREE.Points(gv, matLumieres));

  // hubs
  HUBS.forEach(t => {
    t.pos = surSphere(t.lon, t.lat, R_GLOBE+0.9);
    t.norm = t.pos.clone().normalize();
    const s = sprite(0x5CD0FF, t.maj?7:4.5, t.maj?0.6:0.35);
    s.position.copy(t.pos); gHubs.add(s);
    const an = new THREE.Mesh(new THREE.RingGeometry(1.2,1.45,28),
      new THREE.MeshBasicMaterial({color:0x5CD0FF, transparent:true, opacity:0.5,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
    an.position.copy(t.pos);
    an.lookAt(t.pos.clone().multiplyScalar(2));
    an.userData.ph = Math.random()*Math.PI*2;
    gHubs.add(an); anneauxG.push(an);
  });
  terre.add(gHubs);

  // nuages sphériques
  const matN = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, fog:false,
    uniforms:{uT:uT, uSeuil:uSeuil, uSunL:uSunLocal},
    vertexShader:"varying vec3 vN; void main(){ vN = normalize(position);"
      + " gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader:["uniform float uT, uSeuil; uniform vec3 uSunL; varying vec3 vN;",
      GLSL_BRUIT, GLSL_DENSITE,
      "void main(){",
      "  vec3 v = normalize(vN);",
      "  float lon = degrees(atan(-v.z, v.x)), lat = degrees(asin(clamp(v.y,-1.0,1.0)));",

function habiller(v, courbe, groupe, ech){

    new THREE.LineDashedMaterial({color:0xFF3EA5, transparent:true, opacity:0.32,
      dashSize:2.4*ech, gapSize:3.4*ech, blending:THREE.AdditiveBlending, depthWrite:false}));

  const gr = new THREE.BufferGeometry();

  gr.setAttribute("color",    new THREE.BufferAttribute(new Float32Array(N_RUBAN*2*3),3));
  gr.setIndex(IDX_RUBAN.slice());

    opacity:0.9, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false}));

const _perp = new THREE.Vector3(), _ab = new THREE.Vector3();
function nouveauVolFrance(){
  let a = TERRAINS[(Math.random()*TERRAINS.length)|0], b = a, garde = 0;
  while ((b === a || a.pos.distanceTo(b.pos) < 45) && garde++ < 40)
    b = TERRAINS[(Math.random()*TERRAINS.length)|0];
  const d = a.pos.distanceTo(b.pos);
  _ab.copy(b.pos).sub(a.pos);
  _perp.set(-_ab.z,0,_ab.x).normalize();
  const lat = (Math.random()*2-1)*d*0.13, haut = Math.min(9+d*0.46,72);
  const p0 = a.pos.clone().setY(a.pos.y+0.5), p3 = b.pos.clone().setY(b.pos.y+0.5);
  const c1 = p0.clone().addScaledVector(_ab,0.30).addScaledVector(_perp,lat).setY(a.pos.y+haut*0.95);
  const c2 = p0.clone().addScaledVector(_ab,0.70).addScaledVector(_perp,lat*0.75).setY(b.pos.y+haut*0.95);
  const v = {a,b, roulis:0, t:Math.random()*0.5, duree:17+d*0.17,
    fl:260+10*((Math.random()*12)|0),
    num:CIES[(Math.random()*CIES.length)|0]+(1000+((Math.random()*8000)|0)),
    dist:Math.round(d*9.4), ph:Math.random()};
  return habiller(v, new THREE.CubicBezierCurve3(p0,c1,c2,p3), gVolsF, 1);
}
function nouveauVolGlobe(){
  let a = HUBS[(Math.random()*HUBS.length)|0], b = a, garde = 0;
  while ((b === a || a.pos.distanceTo(b.pos) < 55) && garde++ < 40)
    b = HUBS[(Math.random()*HUBS.length)|0];
  const ua = a.norm, ub = b.norm;
  const ang = Math.acos(Math.max(-1,Math.min(1, ua.dot(ub))));
  const pts = [];
  const nS = 30, hMax = 2.5 + ang*3.4;
  for (let i = 0; i <= nS; i++){
    const f = i/nS;
    const s = Math.sin(ang);
    const k1 = s > 1e-4 ? Math.sin((1-f)*ang)/s : 1-f;
    const k2 = s > 1e-4 ? Math.sin(f*ang)/s : f;
    const dir = new THREE.Vector3().addScaledVector(ua,k1).addScaledVector(ub,k2).normalize();
    const h = R_GLOBE + 1.0 + Math.sin(f*Math.PI)*hMax;
    pts.push(dir.multiplyScalar(h));
  }
  const courbe = new THREE.CatmullRomCurve3(pts);
  const v = {a,b, roulis:0, t:Math.random()*0.5, duree:26+ang*34,
    fl:300+10*((Math.random()*9)|0),
    num:CIES_M[(Math.random()*CIES_M.length)|0]+(100+((Math.random()*900)|0)),
    dist:Math.round(ang*6371), ph:Math.random()};
  return habiller(v, courbe, gVolsG, 0.62);
}
function nouveauVol(){ return mode === "france" ? nouveauVolFrance() : nouveauVolGlobe(); }
function retirerVol(v){
  if (suivi === v){ suivi = null; bLarge.classList.remove("on"); }
  const g = v.avion.parent;
  g.remove(v.route, v.ruban, v.avion);

const _p = new THREE.Vector3(), _tg = new THREE.Vector3(), _tg2 = new THREE.Vector3(),
      _vd = new THREE.Vector3(), _sd = new THREE.Vector3(), _look = new THREE.Vector3(),
      _cl = new THREE.Vector3();
const TEINTE = new THREE.Color(0xC6DCFF);
function majRuban(v){
  const pos = v.ruban.geometry.attributes.position.array;
  const col = v.ruban.geometry.attributes.color.array;
  const t0 = Math.max(0, v.t-0.17);
  // caméra ramenée dans le repère du groupe (le globe tourne)
  _cl.copy(camera.position); v.ruban.parent.worldToLocal(_cl);
  for (let i = 0; i < N_RUBAN; i++){
    const f = i/(N_RUBAN-1), t = t0 + (v.t-t0)*f;
    v.courbe.getPoint(t,_p); v.courbe.getTangent(t,_tg);
    _vd.copy(_cl).sub(_p).normalize();
    _sd.crossVectors(_tg,_vd).normalize();
    const w = (0.26 + (1-f)*2.0)*v.ech, k = Math.pow(f,2.3)*0.9;
    for (let s = 0; s < 2; s++){
      const o = (i*2+s)*3, sg = s ? 1 : -1;
      pos[o]   = _p.x + _sd.x*w*sg;
      pos[o+1] = _p.y + _sd.y*w*sg;
      pos[o+2] = _p.z + _sd.z*w*sg;
      col[o] = TEINTE.r*k; col[o+1] = TEINTE.g*k; col[o+2] = TEINTE.b*k;
    }
  }
  v.ruban.geometry.attributes.position.needsUpdate = true;
  v.ruban.geometry.attributes.color.needsUpdate = true;
}

const C_SOL_BAS = new THREE.Color(0xFF9A4E), C_SOL_HAUT = new THREE.Color(0xDCE9FF);
const C_CIEL_N = new THREE.Color(0x2E4470), C_CIEL_J = new THREE.Color(0x89AEE8);
const C_BRUME_N = new THREE.Color(0x060B18), C_BRUME_J = new THREE.Color(0x2A3A55);
const C_MER_N = new THREE.Color(0x060B1A), C_MER_J = new THREE.Color(0x14294A);
const _c = new THREE.Color();
let jour = 0;

function majSoleil(horloge){
  if (mode === "globe"){
    // le soleil est fixe dans l'espace, c'est la Terre qui tourne
    uSoleil.set(1, 0.12, 0).normalize();
    jour = 1;
    soleil.position.copy(uSoleil).multiplyScalar(900);
    soleil.target.position.set(0,0,0);
    soleil.intensity = 1.55; soleil.color.set(0xFFF1DC);
    hemi.intensity = 0.16; hemi.color.set(0x24406B);
    rim.intensity = 0.05; fill.intensity = 0.05;
    matEtoiles.opacity = 0.85;
    matCompo.uniforms.force.value = 1.0;
    terre.rotation.y = (15*(horloge/3600) - 180)*RAD;
    _cl.copy(uSoleil).applyQuaternion(terre.quaternion.clone().invert());
    uSunLocal.value.copy(_cl);
    return;
  }
  const u = horloge/86400;
  const el = -0.14 + 0.58*Math.sin(u*Math.PI*2 - Math.PI/2);
  const az = (u-0.25)*Math.PI*2;
  uSoleil.set(Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)*0.55).normalize();
  jour = Math.max(0, Math.min(1, (Math.sin(el)+0.10)/0.42));
  const rase = 1 - Math.min(1, Math.abs(Math.sin(el))/0.22);
  soleil.position.copy(uSoleil).multiplyScalar(330);
  soleil.target.position.set(0,SOL,0);
  soleil.intensity = 0.10 + 1.25*jour;
  soleil.color.copy(_c.copy(C_SOL_BAS).lerp(C_SOL_HAUT, Math.min(1,jour*1.2))).lerp(C_SOL_BAS, rase*0.6);
  soleil.castShadow = jour > 0.06;
  uCoulSol.value.copy(soleil.color);
  hemi.intensity = 0.42 + 0.62*jour;
  hemi.color.copy(_c.copy(C_CIEL_N).lerp(C_CIEL_J, jour));
  rim.intensity = 0.30*(1-jour)+0.10;
  fill.intensity = 0.20*(1-jour)+0.06;
  uJourU.value = jour;
  BRUME.color.copy(_c.copy(C_BRUME_N).lerp(C_BRUME_J, jour));
  BRUME.density = 0.0026 - 0.0008*jour;
  matEtoiles.opacity = 0.8*Math.pow(1-jour,1.6);
  if (matVilles) matVilles.opacity = 0.15 + 0.85*Math.pow(1-jour,1.3);
  matMer.color.copy(_c.copy(C_MER_N).lerp(C_MER_J, jour));
  matCompo.uniforms.force.value = 1.15 - 0.45*jour;
  const sy = Math.max(0.12, uSoleil.y);
  let ox = uSoleil.x/sy*(Y_NUAGES-SOL), oz = uSoleil.z/sy*(Y_NUAGES-SOL);
  const l = Math.hypot(ox,oz);
  if (l > 520){ ox *= 520/l; oz *= 520/l; }
  uOff.value.set(ox,oz);
  uSunXZ.value.set(uSoleil.x, uSoleil.z);
  uOmbreF.value = Math.pow(jour,0.7)*0.9;
}
function nomPhase(h3){
  const h = h3/3600;
  if (mode === "globe") return "terminateur";
  if (h < 5.5 || h >= 21) return "nuit";
  if (h < 8) return "aube";
  if (h < 11.5) return "matin";
  if (h < 16.5) return "plein jour";
  if (h < 19) return "couchant";
  return "crépuscule";
}
function densiteTrafic(h3){
  if (mode === "globe") return 1;
  const h = h3/3600;
  const p = Math.exp(-Math.pow(h-8.2,2)/7) + Math.exp(-Math.pow(h-18.0,2)/9);
  const socle = (h > 6 && h < 23) ? 0.55 : 0.12;
  return Math.max(0.10, Math.min(1, socle + p*0.5));
}

function debut(x,y){ glisse = true; lx = x; ly = y; inactif = 0; bougé = 0; cv.classList.add("tire"); }
function bouge(x,y){
  if (!glisse) return;
  const dx = x-lx, dy = y-ly;
  bougé += Math.abs(dx)+Math.abs(dy);
  vTheta = -dx*0.005; vPhi = -dy*0.005;
  orbite.theta += vTheta;
  orbite.phi = Math.max(0.10, Math.min(3.03, orbite.phi + vPhi));

function choisir(x,y){
  souris.set((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  rayon.setFromCamera(souris, camera);
  const hits = rayon.intersectObjects(vols.map(v => v.avion), true);
  if (hits.length){
    let o = hits[0].object;
    while (o && !o.userData.vol) o = o.parent;
    if (o){ suivi = o.userData.vol; bLarge.classList.add("on"); return; }
  }
  if (suivi){ suivi = null; bLarge.classList.remove("on"); }

function rendre(now){
  _sunPos.copy(camera.position).addScaledVector(uSoleil, 2500).project(camera);
  const devant = _sunPos.z < 1;
  const dedansCadre = Math.abs(_sunPos.x) < 1.5 && Math.abs(_sunPos.y) < 1.5;
  matRayons.uniforms.soleilUv.value.set(_sunPos.x*0.5+0.5, _sunPos.y*0.5+0.5);
  matRayons.uniforms.force.value = (devant && dedansCadre)
    ? 0.55*Math.max(0, 1 - Math.max(Math.abs(_sunPos.x),Math.abs(_sunPos.y))/1.5)*(0.35+0.65*jour)
    : 0;

  renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, camera);
  matSeuil.uniforms.tSrc.value = rtScene.texture; passe(matSeuil, rtHalf1);
  const w2 = rtHalf1.width, h2 = rtHalf1.height;
  matFlou.uniforms.tSrc.value = rtHalf1.texture;
  matFlou.uniforms.dir.value.set(1.35/w2,0); passe(matFlou, rtHalf2);
  matFlou.uniforms.tSrc.value = rtHalf2.texture;
  matFlou.uniforms.dir.value.set(0,1.35/h2); passe(matFlou, rtHalf1);
  matRayons.uniforms.tSrc.value = rtHalf1.texture; passe(matRayons, rtRayons);
  const w4 = rtQuart1.width, h4 = rtQuart1.height;
  matFlou.uniforms.tSrc.value = rtHalf1.texture;
  matFlou.uniforms.dir.value.set(2.6/w4,0); passe(matFlou, rtQuart1);
  matFlou.uniforms.tSrc.value = rtQuart1.texture;
  matFlou.uniforms.dir.value.set(0,2.6/h4); passe(matFlou, rtQuart2);
  matCompo.uniforms.tBase.value = rtScene.texture;
  matCompo.uniforms.tGlow.value = rtHalf1.texture;
  matCompo.uniforms.tLarge.value = rtQuart2.texture;
  matCompo.uniforms.tRay.value = rtRayons.texture;
  matCompo.uniforms.temps.value = now*0.001;
  passe(matCompo, null);
}

function animer(now){
  requestAnimationFrame(animer);
  if (!pret) return;
  const dt = Math.min((now-dernier)/1000, 0.05); dernier = now;
  const d = dt*vitesse;

  if (!heureManuelle) horloge = (horloge + d*240) % 86400;
  const hh=(horloge/3600)|0, mm=((horloge%3600)/60)|0, ss=(horloge%60)|0;
  elUtc.textContent = String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  elPhase.textContent = nomPhase(horloge);
  if (heureManuelle){ tMaj += dt; if (tMaj > 2.5) heureManuelle = false; }
  else rHeure.value = Math.round(horloge/60);
  document.getElementById("hHeure").textContent = hh;
  majSoleil(horloge);
  uT.value = now*0.001;

  tTrafic += dt;
  if (tTrafic > 1.2){
    tTrafic = 0;
    const voulu = Math.max(2, Math.round(+rVols.value * densiteTrafic(horloge)));
    if (voulu !== vols.length) ajuster(voulu);
    elAir.textContent = vols.length;
  }

  if (intro < 1 && mode === "france"){
    intro = Math.min(1, intro + dt/3.6);
    const e = 1 - Math.pow(1-intro,3);
    orbite.r = 660 + (255-660)*e;
    orbite.phi = 0.32 + (0.88-0.32)*e;
    orbite.theta = 0.15 - 0.55*e;
  } else {
    inactif += dt;
    if (!glisse){
      orbite.theta += vTheta;
      orbite.phi = Math.max(0.10, Math.min(3.03, orbite.phi + vPhi));
      vTheta *= 0.92; vPhi *= 0.92;
      if (Math.abs(vTheta) < 1e-5) vTheta = 0;
      if (Math.abs(vPhi) < 1e-5) vPhi = 0;
    }
    if (rotationAuto && !glisse && inactif > 2.5 && !suivi)
      orbite.theta += dt*(mode === "globe" ? 0.016 : 0.028);
  }

  if (suivi){
    suivi.avion.getWorldPosition(cibleVoulue);
    const rSuivi = mode === "globe" ? 42 : 74;
    orbite.r += (rSuivi-orbite.r)*Math.min(1, dt*1.6);
  } else if (intro >= 1){
    if (mode === "france") cibleVoulue.set(0,6,4); else cibleVoulue.set(0,0,0);
  }
  cible.lerp(cibleVoulue, Math.min(1, dt*2.2));
  placerCamera();

  const puls = now*0.001;
  const listeAnneaux = mode === "france" ? anneaux : anneauxG;
  listeAnneaux.forEach(an => {
    const k = (Math.sin(puls*1.4 + an.userData.ph)+1)/2;
    an.scale.setScalar(1 + k*2.2);
    an.material.opacity = 0.42*(1-k)*(mode === "globe" ? 1 : (0.35+0.65*(1-jour)));
  });
  const feuxOp = mode === "globe" ? 1 : 0.35 + 0.65*(1-jour);

  for (let i = 0; i < vols.length; i++){
    const v = vols[i];
    v.t += d/v.duree;
    if (v.t >= 1){ retirerVol(v); vols[i] = nouveauVol(); continue; }
    v.courbe.getPoint(v.t,_p);
    v.avion.position.copy(_p);
    v.courbe.getTangent(v.t,_tg);
    v.avion.lookAt(_look.copy(_p).add(_tg));
    if (mode === "globe"){
      // rester « debout » par rapport à la surface
      v.avion.up.copy(_p).normalize();
      v.avion.lookAt(_look.copy(_p).add(_tg));
    }
    v.courbe.getTangent(Math.min(0.999, v.t+0.012), _tg2);
    const dcap = Math.atan2(_tg2.x,_tg2.z) - Math.atan2(_tg.x,_tg.z);
    const vise = Math.max(-0.7, Math.min(0.7, -dcap*9));
    v.roulis += (vise - v.roulis)*Math.min(1, dt*2.5);
    if (mode === "france") v.avion.rotateZ(v.roulis);
    const on = ((puls + v.ph*2) % 1.15) < 0.09;
    v.avion.userData.strobe[0].visible = on;
    v.avion.userData.strobe[1].visible = on;
    const f = v.avion.userData.feux;
    f[0].material.opacity = 0.55*feuxOp; f[1].material.opacity = 0.55*feuxOp;
    f[2].material.opacity = 0.9*feuxOp;  f[3].material.opacity = 0.45*feuxOp;
    majRuban(v);
  }

  majLabels();
  accStrips += dt;
  if (accStrips > 0.18){ majStrips(); accStrips = 0; }
  if (mode === "france" && (cadre++ % 10) === 0) renderer.shadowMap.needsUpdate = true;
  rendre(now);
}

/* ══════════ 11. Démarrage ════════════════════════════════════════ */
function demarrer(){
  construireRelief();
  construireCotes();
  construireFleuves();
  construireVilles();
  construireTerrains();
  ajuster(Math.max(2, Math.round(+rVols.value * densiteTrafic(horloge))));
  elAir.textContent = vols.length;
  majSoleil(horloge);
  renderer.shadowMap.needsUpdate = true;
  pret = true;
  dernier = performance.now();
  setTimeout(() => document.getElementById("demarrage").classList.add("parti"), 120);
}
requestAnimationFrame(animer);
requestAnimationFrame(() => setTimeout(demarrer, 40));
})();
</script>
